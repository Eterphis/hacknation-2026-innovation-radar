<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar innowacji – dane</title>
<style>
:root {
  --bg: #f5f6f8; --panel: #fff; --soft: #f0f2f5; --line: #e3e6ea;
  --text: #1c2026; --muted: #6a7380; --accent: #1f5fbf; --accent-soft: #e8effb;
  --ok: #1b7f47; --ok-soft: #e4f3ea; --warn: #9a6200; --warn-soft: #fbf0d9; --code: #f3f4f6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101317; --panel: #171b21; --soft: #1f242b; --line: #2b313a;
    --text: #e7eaee; --muted: #98a2af; --accent: #7aa7ff; --accent-soft: #1c2a42;
    --ok: #55c48e; --ok-soft: #15291f; --warn: #e3b450; --warn-soft: #2c2412; --code: #12161b;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
input, select, button { font: inherit; color: inherit; }
header { padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 17px; margin: 0; font-weight: 650; }
header .file { color: var(--muted); font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
main { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); height: calc(100% - 64px); }
aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.filters { padding: 12px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
.row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
input[type=search], select { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.count { padding: 6px 12px; color: var(--muted); font-size: 13px; }
#list { overflow-y: auto; flex: 1; }
.item { padding: 11px 12px; border-top: 1px solid var(--line); cursor: pointer; }
.item:hover { background: var(--soft); }
.item.sel { background: var(--accent-soft); }
.item .t { font-weight: 550; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item .m { color: var(--muted); font-size: 13px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag { display: inline-block; font-size: 12px; padding: 0 7px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; }
.tag.src { background: var(--soft); color: var(--muted); margin-left: 0; margin-right: 6px; }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
#detail { overflow-y: auto; padding: 24px 32px 80px; min-width: 0; }
.wrap { max-width: 860px; }
.empty { color: var(--muted); padding: 48px 20px; text-align: center; }
h2 { font-size: 21px; line-height: 1.3; margin: 0 0 4px; }
.sub { color: var(--muted); font-size: 14px; }
section, details { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-top: 14px; }
section > h3, summary { margin: 0; padding: 12px 16px; font-size: 14px; font-weight: 650; }
section > h3 { border-bottom: 1px solid var(--line); }
summary { cursor: pointer; }
.kv { display: grid; grid-template-columns: 190px minmax(0, 1fr); }
.kv > div { padding: 8px 16px; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
.kv > div:nth-child(-n+2) { border-top: 0; }
.kv .k { color: var(--muted); }
.raw { color: var(--muted); font-size: 13px; }
code, pre { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 13px; }
code { background: var(--code); padding: 1px 5px; border-radius: 4px; }
pre { margin: 0; padding: 14px 16px; background: var(--code); border-top: 1px solid var(--line); overflow: auto; max-height: 520px; white-space: pre-wrap; overflow-wrap: anywhere; }
.text { padding: 4px 16px 14px; }
.text h4 { margin: 12px 0 4px; font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.text p { margin: 0 0 8px; white-space: pre-line; }
ul { margin: 0; padding-left: 18px; }
a { color: var(--accent); }
.status-ok { color: var(--ok); font-weight: 600; }
.status-warn { color: var(--warn); font-weight: 600; }
@media (max-width: 860px) {
  main { grid-template-columns: minmax(0, 1fr); height: auto; }
  aside { max-height: 50vh; border-right: 0; border-bottom: 1px solid var(--line); }
  #detail { padding: 16px 16px 60px; }
  .kv { grid-template-columns: minmax(0, 1fr); }
  .kv .k { padding-bottom: 0; }
  .kv .k + div { border-top: 0; padding-top: 2px; }
}
</style>
</head>
<body>
<header>
  <h1>Radar innowacji · wczytane dane</h1>
  <div class="file" id="file">Wczytywanie…</div>
</header>
<main>
  <aside>
    <div class="filters">
      <input type="search" id="q" placeholder="Szukaj po tytule, beneficjencie, programie" autocomplete="off">
      <select id="f-source" aria-label="Źródło"><option value="">Wszystkie źródła</option></select>
      <div class="row">
        <select id="f-quality" aria-label="Jakość rekordu"><option value="">Każda jakość</option><option value="ok">Kompletne (ok)</option><option value="needs_review">Do przeglądu</option></select>
        <select id="f-voiv" aria-label="Województwo"><option value="">Każde województwo</option></select>
      </div>
    </div>
    <div class="count" id="count"></div>
    <div id="list" role="listbox" aria-label="Rekordy"></div>
  </aside>
  <div id="detail"><div class="empty">Wybierz rekord z listy.</div></div>
</main>
<script>
const SOURCE_SHORT = {ncbr_sukcesy: "NCBR", interreg_pl: "Interreg", epo_ep: "EPO"};
const TEXT_PL = {abstract: "Abstrakt", first_claim: "Zastrzeżenie 1", description: "Opis", problem: "Jaki problem rozwiązuje", result: "Efekt pracy",
  users: "Kto korzysta / skorzysta", challenges: "Największe wyzwania", advice: "Rada dla wnioskodawców",
  market_readiness: "Gotowość rynkowa", commercialization: "Ścieżka komercjalizacji",
  commercialization_barriers: "Trudności w komercjalizacji", ip: "Własność intelektualna"};
const STATUS_PL = {finished: "zakończony", running: "w trakcie", planned: "planowany"};
const ROLE_PL = {beneficiary: "beneficjent", partner: "partner", lead_partner: "partner wiodący", applicant: "zgłaszający", inventor: "twórca"};

let ALL = [], VIEW = [], SEL = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const safeUrl = (u) => /^https?:\/\//.test(u || "") ? u : null;
const link = (u) => safeUrl(u) ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>` : null;
const dt = (s) => s ? esc(s.replace("T", " ").replace("+00:00", " UTC")) : null;
const or = (v) => (v === null || v === undefined || v === "" || (Array.isArray(v) && !v.length)) ? '<span class="raw">brak</span>' : v;
const amount = (x, cur) => x == null ? null : x.toLocaleString("pl-PL", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " " + esc(cur || "");
const yesno = (b) => b === true ? "tak" : b === false ? "nie" : null;
const kv = (rows) => `<div class="kv">${rows.filter(Boolean).map(([k, v]) => `<div class="k">${esc(k)}</div><div>${or(v)}</div>`).join("")}</div>`;
const short = (s) => SOURCE_SHORT[s] || s;

async function load() {
  const [meta, rows] = await Promise.all([fetch("/api/meta").then((r) => r.json()), fetch("/api/records").then((r) => r.json())]);
  ALL = rows;
  $("file").innerHTML = `${meta.records} rekordów z plików: ` +
    meta.files.map((f) => `<code>${esc(f.path)}</code> (${f.records})`).join(", ");
  for (const [id, name] of Object.entries(meta.source_ids)) {
    const o = document.createElement("option"); o.value = id; o.textContent = name; $("f-source").appendChild(o);
  }
  for (const v of [...new Set(ALL.flatMap((r) => r.voivodeships))].sort((a, b) => a.localeCompare(b, "pl"))) {
    const o = document.createElement("option"); o.value = v; o.textContent = v; $("f-voiv").appendChild(o);
  }
  render();
  const first = decodeURIComponent(location.hash.slice(1)) || (VIEW[0] && VIEW[0].key);
  if (first) select(first);
}

function render() {
  const q = $("q").value.trim().toLowerCase(), src = $("f-source").value, qual = $("f-quality").value, voiv = $("f-voiv").value;
  VIEW = ALL.filter((r) =>
    (!q || [r.title, r.beneficiary, r.programme, r.contest].join(" ").toLowerCase().includes(q)) &&
    (!src || r.source === src) && (!qual || r.quality === qual) && (!voiv || r.voivodeships.includes(voiv)));
  $("count").textContent = `${VIEW.length} z ${ALL.length} rekordów`;
  $("list").innerHTML = VIEW.map((r) => {
    const where = r.voivodeships.length ? r.voivodeships.join(", ") : (r.country && r.country !== "Polska" ? r.country : "");
    return `<div class="item${r.key === SEL ? " sel" : ""}" data-id="${esc(r.key)}" role="option">
      <div class="t">${esc(r.title)}${r.quality === "needs_review" ? '<span class="tag warn">do przeglądu</span>' : ""}</div>
      <div class="m"><span class="tag src">${esc(short(r.source))}</span>${esc(r.beneficiary || "beneficjent nieustalony")}${where ? " · " + esc(where) : ""}</div>
    </div>`;
  }).join("") || '<div class="empty">Brak rekordów.</div>';
  for (const el of $("list").querySelectorAll(".item")) el.onclick = () => select(el.dataset.id);
}

async function select(key) {
  SEL = key;
  history.replaceState(null, "", "#" + encodeURIComponent(key));
  for (const el of $("list").querySelectorAll(".item")) el.classList.toggle("sel", el.dataset.id === key);
  const [source, id] = key.split("/");
  const res = await fetch(`/api/records/${encodeURIComponent(source)}/${encodeURIComponent(id)}`);
  if (!res.ok) { $("detail").innerHTML = '<div class="empty">Nie znaleziono rekordu.</div>'; return; }
  renderDetail(await res.json());
}

function renderDetail({record: r, raw_files: raw, data_file}) {
  const p = r.provenance || {}, q = r.quality || {}, f = r.funding || {}, per = r.period || {}, reg = r.region || {};
  const rawRow = (label, info) => info ? [label, `<code>${esc(info.path)}</code>${info.exists ? "" : ' <span class="raw">(brak pliku)</span>'}`] : null;
  const fileSource = !!p.source_file_url;
  const pat = r.patent;

  const source = kv([
    ["Źródło", esc(r.source_name) + ` <span class="raw">(${esc(r.source)})</span>`],
    fileSource ? null : [pat ? "Strona w EPO Register" : "Strona projektu", link(r.url)],
    [pat ? "Endpoint SPARQL" : "Strona listy", link(r.list_url)],
    fileSource ? ["Plik źródłowy", link(p.source_file_url)] : null,
    fileSource ? ["Wiersz w pliku", p.source_row != null ? String(p.source_row) : null] : null,
    pat ? ["Dokument źródłowy", (p.source_documents || []).length ? p.source_documents.map(link).join("<br>") : null] : null,
    [pat ? "Pobrano dane SPARQL" : "Pobrano stronę listy", dt(p.list_fetched_at)],
    [fileSource ? "Pobrano plik" : pat ? "Pobrano dokument" : "Pobrano stronę projektu", dt(p.detail_fetched_at)],
    ["Konektor", p.connector ? `<code>${esc(p.connector)}</code>` : null],
    ["Schemat rekordu", r.schema ? `<code>${esc(r.schema)}</code>` : null],
    ["ID rekordu", `<code>${esc(r.record_id)}</code>`],
    ["Hash treści", r.content_hash ? `<code>${esc(r.content_hash.slice(0, 16))}…</code>` : null],
    ["Plik danych", `<code>${esc(data_file)}</code>`],
    rawRow("Zapisany plik źródłowy", raw.source_file),
    rawRow("Zapisany dokument", raw.source_document),
    rawRow("Zapisana strona projektu", raw.detail_page),
    rawRow("Zapisana strona listy", raw.list_page),
  ]);

  const quality = kv([
    ["Status", q.status === "ok" ? '<span class="status-ok">ok</span>' : `<span class="status-warn">${esc(q.status)}</span>`],
    ["Blokujące", (q.blocking || []).length ? `<ul>${q.blocking.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : null],
    ["Ostrzeżenia", (q.warnings || []).length ? `<ul>${q.warnings.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : null],
    ["Długość opisu", q.narrative_chars != null ? `${q.narrative_chars} znaków` : null],
  ]);

  const loc = (o) => o.location ? [o.location.street, [o.location.postal_code, o.location.city].filter(Boolean).join(" "),
    o.location.powiat && o.location.powiat !== o.location.city ? "pow. " + o.location.powiat : null, o.location.region, o.location.country].filter(Boolean).join(", ") : "";
  const orgs = (r.organizations || []).map((o) => `<li>${esc(o.name)} <span class="raw">· ${esc(ROLE_PL[o.role] || o.role)}${o.type_hint ? " · typ (podpowiedź): " + esc(o.type_hint) : ""}${loc(o) ? " · " + esc(loc(o)) : ""}</span></li>`).join("");
  const people = (r.people || []).map((x) => `<li>${esc(x.name)} <span class="raw">· ${esc(ROLE_PL[x.role] || x.role || "rola nieznana")}${x.titles ? " · " + esc(x.titles) : ""}${x.country ? " · " + esc(x.country) : ""}</span></li>`).join("");
  const raws = f.raw || {};
  const inSource = (v) => v ? ` <span class="raw">· w źródle: ${esc(v)}</span>` : "";
  const hasFunding = Object.keys(f).length > 0;
  const pubLinks = (x) => [x.html && `<a href="${esc(safeUrl(x.html))}" target="_blank" rel="noopener">HTML</a>`,
    x.pdf && `<a href="${esc(safeUrl(x.pdf))}" target="_blank" rel="noopener">PDF</a>`].filter(Boolean).join(" · ");
  const patentRows = pat ? [
    ["Numer zgłoszenia", `<code>${esc(pat.application_number)}</code>${pat.application_number_original ? ` <span class="raw">(${esc(pat.application_number_original)})</span>` : ""}`],
    ["Data zgłoszenia", esc(pat.filing_date)],
    ["Publikacje", (pat.publications || []).length ? `<ul>${pat.publications.map((x) => `<li><code>${esc(x.id)}</code> · ${esc(x.date)} ${pubLinks(x) ? "· " + pubLinks(x) : ""}</li>`).join("")}</ul>` : null],
    ["Patent udzielony", pat.granted ? `tak · <code>${esc(pat.grant.publication)}</code> · ${esc(pat.grant.date)}` : '<span class="raw">brak publikacji B1 (w toku, wycofane lub odrzucone)</span>'],
    pat.pct_application ? ["Zgłoszenie PCT", `<code>${esc(pat.pct_application)}</code>`] : null,
    (pat.priorities || []).length ? ["Priorytety", pat.priorities.map((x) => `<code>${esc(x)}</code>`).join(", ")] : null,
    pat.family ? ["Rodzina patentowa", `<code>${esc(pat.family)}</code>`] : null,
    ["Klasy CPC", (pat.cpc || []).length ? pat.cpc.map((x) => `<code>${esc(x)}</code>`).join(" ") : null],
    ["Klasy IPC", (pat.ipc || []).length ? pat.ipc.map((x) => `<code>${esc(x)}</code>`).join(" ") : null],
    ["Tytuły", Object.entries(pat.titles || {}).map(([l, t]) => `<span class="raw">${esc(l)}:</span> ${esc(t)}`).join("<br>")],
  ] : [];
  const data = kv([
    ["Tytuł", esc(r.title)],
    ["Organizacje", orgs ? `<ul>${orgs}</ul>` : null],
    people ? ["Osoby", `<ul>${people}</ul>`] : null,
    ...patentRows,
    hasFunding ? ["Operator / program", [f.operator, f.programme].filter(Boolean).map(esc).join(" · ") || null] : null,
    f.project_no ? ["Numer projektu", `<code>${esc(f.project_no)}</code>`] : null,
    f.contest ? ["Konkurs", esc(f.contest)] : null,
    f.fund ? ["Fundusz", esc(f.fund)] : null,
    f.specific_objective ? ["Cel szczegółowy", esc(f.specific_objective)] : null,
    f.intervention_field ? ["Zakres interwencji", esc(f.intervention_field)] : null,
    !hasFunding ? null : ["Wartość projektu", f.total_value != null ? amount(f.total_value, f.currency) + inSource(raws.total_value) : (raws.total_value ? `<span class="raw">nieodczytane: ${esc(raws.total_value)}</span>` : null)],
    !hasFunding ? null : ["Dofinansowanie", f.grant_value != null ? amount(f.grant_value, f.currency) + (f.grant_share != null ? ` (${Math.round(f.grant_share * 100)}%)` : "") +
      (f.grant_value_computed ? ' <span class="raw">· wyliczone: wartość × stopa dofinansowania</span>' : inSource(raws.grant_value)) : null],
    f.strategic_project != null ? ["Projekt strategiczny", yesno(f.strategic_project)] : null,
    f.above_5m_eur != null ? ["Powyżej 5 mln EUR", yesno(f.above_5m_eur)] : null,
    pat ? null : ["Okres", per.start || per.end ? `${esc(per.start || "?")} – ${esc(per.end || (per.ongoing ? "w toku" : "?"))} · ${esc(STATUS_PL[per.status] || per.status || "")}${inSource(per.raw)}` : (per.raw ? `<span class="raw">nieodczytane: ${esc(per.raw)}</span>` : null)],
    [pat ? "Miejscowość zgłaszającego (PL)" : "Województwo / region", (reg.voivodeships || []).length || reg.nationwide ? esc((reg.voivodeships || []).join(", ") || "cała Polska") + inSource(reg.raw)
      : (reg.raw ? esc(reg.raw) + (reg.country ? ` <span class="raw">· ${esc(reg.country)}</span>` : "") : null)],
    (r.keywords || []).length ? ["Słowa kluczowe", esc(r.keywords.join(", "))] : null,
    ["Prawa do treści", r.rights ? `${esc(r.rights.licence)} <span class="raw">· ${esc(r.rights.note || "")}</span>` : null],
  ]);

  const t = r.text || {};
  const texts = [
    r.intro ? `<h4>Zajawka</h4><p>${esc(r.intro)}</p>` : "",
    ...Object.keys(TEXT_PL).filter((k) => t[k]).map((k) => `<h4>${TEXT_PL[k]}</h4><p>${esc(t[k])}</p>`),
    ...(t.other || []).map((o) => `<h4>${esc(o.heading || "Inne")}</h4><p>${esc(o.text)}</p>`),
  ].join("") || '<p class="raw">Brak treści opisowej.</p>';

  $("detail").innerHTML = `<div class="wrap">
    <h2>${esc(r.title)}</h2>
    <div class="sub">${esc(r.source_name)} · rekord ${q.status === "ok" ? '<span class="status-ok">kompletny</span>' : '<span class="status-warn">do przeglądu</span>'}</div>
    <section><h3>Źródło wczytania</h3>${source}</section>
    <section><h3>Dane rekordu</h3>${data}</section>
    <section><h3>${fileSource ? "Treść z pliku" : pat ? "Treść z dokumentu patentowego" : "Treść ze strony"}</h3><div class="text">${texts}</div></section>
    <section><h3>Jakość wczytania</h3>${quality}</section>
    <details><summary>Surowy JSON rekordu</summary><pre>${esc(JSON.stringify(r, null, 2))}</pre></details>
  </div>`;
  $("detail").scrollTop = 0;
}

function move(step) {
  const i = VIEW.findIndex((r) => r.key === SEL);
  const next = VIEW[Math.max(0, Math.min(VIEW.length - 1, i + step))];
  if (next) { select(next.key); document.querySelector(`.item[data-id="${CSS.escape(next.key)}"]`)?.scrollIntoView({block: "nearest"}); }
}
document.addEventListener("keydown", (e) => {
  if (["INPUT", "SELECT"].includes(document.activeElement.tagName)) return;
  if (e.key === "ArrowDown") { e.preventDefault(); move(1); }
  if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
});
for (const id of ["q", "f-source", "f-quality", "f-voiv"]) $(id).addEventListener("input", render);
load();
</script>
</body>
</html>
