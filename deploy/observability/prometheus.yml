global:
  scrape_interval: 15s
  evaluation_interval: 30s
scrape_configs:
  - job_name: radar-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  # Celery workers and tasks (Flower's Prometheus endpoint): flower_events_total, flower_worker_online, ...
  - job_name: flower
    metrics_path: /metrics
    static_configs:
      - targets: ["flower:5555"]
rule_files: ["/etc/prometheus/alerts.yml"]
