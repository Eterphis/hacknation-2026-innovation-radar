{{- /* Built-in Postgres and RabbitMQ for demo / small installs. Production: enabled=false + external services. */}}
{{- if .Values.postgresql.enabled }}
{{- $c := dict "root" . "component" "postgres" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "radar.fullname" . }}-postgres
  labels: {{- include "radar.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "radar.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "radar.selector" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "radar.selector" $c | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image }}
          env:
            - { name: POSTGRES_USER, value: {{ .Values.postgresql.user | quote }} }
            - { name: POSTGRES_PASSWORD, value: {{ .Values.postgresql.password | quote }} }
            - { name: POSTGRES_DB, value: {{ .Values.postgresql.database | quote }} }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ name: pg, containerPort: 5432 }]
          readinessProbe: { exec: { command: ["pg_isready", "-U", {{ .Values.postgresql.user | quote }}] }, periodSeconds: 5 }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgresql.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.postgresql.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "radar.fullname" . }}-postgres
  labels: {{- include "radar.labels" . | nindent 4 }}
spec:
  selector: {{- include "radar.selector" $c | nindent 4 }}
  ports: [{ name: pg, port: 5432, targetPort: pg }]
---
{{- end }}
{{- if .Values.rabbitmq.enabled }}
{{- $c := dict "root" . "component" "rabbitmq" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "radar.fullname" . }}-rabbitmq
  labels: {{- include "radar.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "radar.fullname" . }}-rabbitmq
  replicas: 1
  selector:
    matchLabels: {{- include "radar.selector" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "radar.selector" $c | nindent 8 }}
    spec:
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image }}
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: {{ .Values.rabbitmq.user | quote }} }
            - { name: RABBITMQ_DEFAULT_PASS, value: {{ .Values.rabbitmq.password | quote }} }
          ports: [{ name: amqp, containerPort: 5672 }, { name: mgmt, containerPort: 15672 }]
          readinessProbe: { exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }, periodSeconds: 10, timeoutSeconds: 10 }
          volumeMounts: [{ name: data, mountPath: /var/lib/rabbitmq }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.rabbitmq.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.rabbitmq.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "radar.fullname" . }}-rabbitmq
  labels: {{- include "radar.labels" . | nindent 4 }}
spec:
  selector: {{- include "radar.selector" $c | nindent 4 }}
  ports: [{ name: amqp, port: 5672, targetPort: amqp }, { name: mgmt, port: 15672, targetPort: mgmt }]
---
{{- end }}
{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "radar.fullname" . }}-migrate-{{ .Release.Revision }}
  labels: {{- include "radar.labels" . | nindent 4 }}
  annotations:
    # post-install so the built-in Postgres exists on first install; pre-upgrade afterwards (T030: Alembic)
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      {{- include "radar.podCommon" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "radar.image" . }}
          command: ["radar", "initdb"]
          env: {{- include "radar.env" . | nindent 12 }}
          envFrom: {{- include "radar.envFrom" . | nindent 12 }}
          volumeMounts: {{- include "radar.volumeMounts" . | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
      volumes: {{- include "radar.volumes" . | nindent 8 }}
{{- end }}
