{{- $c := dict "root" . "component" "api" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "radar.fullname" . }}-api
  labels: {{- include "radar.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "radar.selector" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "radar.selector" $c | nindent 8 }}
      annotations: {{- include "radar.checksums" . | nindent 8 }}
    spec:
      {{- include "radar.podCommon" . | nindent 6 }}
      containers:
        - name: api
          image: {{ include "radar.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "radar.api.main:app", "--host", "0.0.0.0", "--port", "{{ .Values.api.port }}", "--proxy-headers"]
          ports: [{ name: http, containerPort: {{ .Values.api.port }} }]
          env: {{- include "radar.env" . | nindent 12 }}
          envFrom: {{- include "radar.envFrom" . | nindent 12 }}
          volumeMounts: {{- include "radar.volumeMounts" . | nindent 12 }}
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20, failureThreshold: 3 }
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
      volumes: {{- include "radar.volumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "radar.fullname" . }}-api
  labels: {{- include "radar.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "radar.selector" $c | nindent 4 }}
  ports: [{ name: http, port: {{ .Values.service.port }}, targetPort: http }]
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "radar.fullname" . }}-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "radar.fullname" . }}-api }
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.api.autoscaling.targetCPU }} } }
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "radar.fullname" . }}
  labels: {{- include "radar.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ include "radar.fullname" . }}-api, port: { name: http } } }
{{- end }}
