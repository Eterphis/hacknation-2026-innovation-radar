image:
  repository: ghcr.io/eterphis/innovation-radar
  tag: ""            # default: .Chart.AppVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Common env for every role (api, workers, beat, consumers).
config:
  demoMode: true
  # local model -> rules. Cloud models (anthropic, openai) only when listed here AND allowCloud: true.
  llmProviders: "local,mock"
  allowCloud: false
  # hashing (default: better on the 60-record eval, E-003) or fastembed (multilingual-e5-small, ONNX on CPU,
  # baked into the image; E-004). Thresholds per embedder: radar/basal/embed.py CALIBRATION.
  embedder: hashing
  # USD per 1M tokens for the radar_llm_cost_usd_total metric, e.g. { anthropic: [3, 15] }; empty = cost 0
  llmPrices: {}
  anthropicModel: claude-sonnet-5-5
  openaiBaseUrl: https://api.openai.com/v1
  openaiModel: gpt-4o-mini
  logLevel: INFO
extraEnv: []

# Secret values (LLM keys, source tokens, webhook HMAC secrets RADAR_WEBHOOK_SECRET_<ID>).
# Leave existingSecret empty to let the chart create one from `secrets`.
existingSecret: ""
secrets: {}
#  RADAR_ANTHROPIC_API_KEY: ""
#  RADAR_OPENAI_API_KEY: ""
#  OPENAIRE_TOKEN: ""
#  RADAR_WEBHOOK_SECRET_ZGLOSZENIA: ""

api:
  replicas: 2
  port: 8000
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
  autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 6, targetCPU: 70 }

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: radar.local
  tls: []

# One Deployment per entry; each consumes the listed Celery queues (stages scale independently).
workers:
  - name: ingest
    queues: [harvest, normalize, resolve_org, dedup, gate, link]
    concurrency: 4
    replicas: 1
    resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 768Mi } }
    autoscaling: { enabled: false, minReplicas: 1, maxReplicas: 6, targetCPU: 70 }
  - name: llm
    queues: [extract, maturity, score]
    concurrency: 2
    replicas: 1
    resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 768Mi } }
    autoscaling: { enabled: false, minReplicas: 1, maxReplicas: 8, targetCPU: 70 }

# Worker autoscaling. With KEDA in the cluster: scale each worker Deployment by its RabbitMQ queue length
# (idle -> minReplicas, burst -> maxReplicas). Without KEDA: per-worker CPU HPA via workers[].autoscaling.
keda:
  enabled: false
  minReplicas: 1
  maxReplicas: 8
  messagesPerReplica: 50   # target queue length per replica
  cooldownSeconds: 300

pdb:
  enabled: true            # API keeps one pod during node drains

serviceMonitor:
  enabled: false           # Prometheus Operator: scrape the API /metrics
  interval: 30s
  labels: {}

beat:
  enabled: true
  resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }

# Push sources of type amqp | gcp_pubsub | kafka get their own consumer Deployment automatically.
consumers:
  replicas: 1
  resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 384Mi } }

# Contents of sources.yaml (ConfigMap). null = use the file baked into the image.
# Override per environment, e.g. -f values-prod.yaml with your own `sources:` list.
sources: null

postgresql:
  enabled: true          # false = use externalDatabase.url (managed Postgres)
  image: postgres:16-alpine
  user: radar
  password: radar        # change, or use externalDatabase with a secret
  database: radar
  storage: 5Gi
  storageClass: ""
externalDatabase:
  url: ""                # postgresql+psycopg://user:pass@host:5432/db
  existingSecret: ""     # secret with key RADAR_DATABASE_URL

rabbitmq:
  enabled: true          # false = use externalBroker.url
  image: rabbitmq:3.13-management-alpine
  user: radar
  password: radar
  storage: 2Gi
  storageClass: ""
externalBroker:
  url: ""
  existingSecret: ""     # secret with key RADAR_BROKER_URL

# Small LLM on the cluster's CPU nodes (llama.cpp server, OpenAI-compatible). Default: Bielik 1.5B v3.0 Instruct
# GGUF Q8_0 (Polish, Apache-2.0, ~1.7 GB). 4.5B needs ~6 GB RAM. Scale by replicas; no GPU required.
localLLM:
  enabled: false
  image: ghcr.io/ggml-org/llama.cpp:server
  hfModel: speakleash/Bielik-1.5B-v3.0-Instruct-GGUF:Q8_0
  alias: bielik-1.5b-v3.0-instruct
  contextSize: 4096
  threads: 4
  timeoutSeconds: 300    # per call; ~60 s per agent step on 4 vCPU for 1.5B Q8_0
  replicas: 1
  cacheSize: 5Gi
  resources: { requests: { cpu: "2", memory: 3Gi }, limits: { memory: 4Gi } }

migrations:
  enabled: true          # post-install/pre-upgrade Job: radar migrate (Alembic, T030); API pods also migrate under an advisory lock

podSecurityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: false, capabilities: { drop: [ALL] } }
nodeSelector: {}
tolerations: []
affinity: {}
