# CI: tests of both packages, Helm lint/template, image build (push to GHCR from main), k3d install smoke test.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Image name: ghcr.io/<owner>/innovation-radar, lower-cased in a step (registry names must be lowercase and the
# owner here is "Eterphis"; expressions have no lower()), exported as IMAGE to the later steps of each job.

jobs:
  test-app:
    name: pytest app/ (pipeline, Basal, agent, API)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: app/pyproject.toml }
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: migrations match the models
        run: python -m pytest -q tests/test_migrations.py

  test-harvester:
    name: pytest radar/ (harvester, connectors, crawler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # separate job: both packages are called `radar`, they must not share one environment
      - run: pip install pytest
      - run: python -m pytest -q tests

  helm:
    name: helm lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.16.3 }
      - run: helm lint deploy/helm/innovation-radar
      - run: helm lint deploy/helm/innovation-radar --set localLLM.enabled=true --set ingress.enabled=true --set existingSecret=radar-keys
      - name: render (defaults, local LLM, external services)
        run: |
          helm template radar deploy/helm/innovation-radar > /tmp/default.yaml
          helm template radar deploy/helm/innovation-radar --set localLLM.enabled=true --set config.embedder=fastembed \
            --set existingSecret=radar-keys --set postgresql.enabled=false --set externalDatabase.existingSecret=db \
            --set rabbitmq.enabled=false --set externalBroker.existingSecret=mq > /tmp/full.yaml
          grep -q "radar\", \"migrate\"" /tmp/default.yaml
          grep -q "RADAR_LOCAL_LLM_URL" /tmp/full.yaml
          grep -q "name: radar-keys" /tmp/full.yaml

  observability:
    name: promtool (alert rules, Prometheus config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker run --rm -v "$PWD/deploy/observability:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml
      - run: python3 -c "import json; [json.load(open(f'deploy/observability/grafana/dashboards/{n}.json', encoding='utf-8'))['panels'] for n in ('radar', 'costs')]"

  image:
    name: docker build (push to GHCR on main)
    runs-on: ubuntu-latest
    needs: [test-app, helm]
    permissions: { contents: read, packages: write }
    steps:
      - name: image name (lowercase) and tags
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/innovation-radar"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          {
            echo "tags<<EOF"
            echo "$IMAGE:$GITHUB_SHA"
            echo "$IMAGE:ci"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then echo "$IMAGE:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test of the image (migrate + demo + /healthz)
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: |
          docker run --rm -e RADAR_DATABASE_URL=sqlite:////tmp/r.db ${{ env.IMAGE }}:ci sh -c \
            "radar migrate && RADAR_EMBEDDER=fastembed python -c 'from radar.basal.embed import get_embedder as g; n=g().name; print(n); assert n.startswith(\"fastembed\")'"
      - name: save image for the k3d job
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: docker save ${{ env.IMAGE }}:ci -o /tmp/image.tar
      - uses: actions/upload-artifact@v4
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        with: { name: image, path: /tmp/image.tar, retention-days: 1 }

  k3d:
    name: helm install on k3d (all pods Ready)
    runs-on: ubuntu-latest
    needs: [image]
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 25
    steps:
      - name: image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/innovation-radar" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: image, path: /tmp }
      - uses: azure/setup-helm@v4
        with: { version: v3.16.3 }
      - name: k3d cluster
        run: |
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/v5.7.4/install.sh | TAG=v5.7.4 bash
          k3d cluster create radar --agents 1 --wait
          docker load -i /tmp/image.tar
          k3d image import ${{ env.IMAGE }}:ci -c radar
      - name: helm install --wait
        run: |
          helm install radar deploy/helm/innovation-radar --set image.repository=${{ env.IMAGE }} --set image.tag=ci \
            --set image.pullPolicy=Never --set api.replicas=1 --wait --timeout 15m
          kubectl get pods -o wide
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/instance=radar --field-selector=status.phase=Running --timeout=5m
          kubectl get jobs
      - name: API answers inside the cluster
        run: |
          kubectl port-forward svc/radar-innovation-radar-api 8080:80 & sleep 5
          curl -fsS localhost:8080/healthz && curl -fsS localhost:8080/metrics | grep -q radar_stage_runs_total
      - if: failure()
        run: |
          kubectl get pods -o wide; kubectl describe pods | tail -200
          for p in $(kubectl get pods -o name); do echo "== $p"; kubectl logs $p --all-containers --tail 60 || true; done
