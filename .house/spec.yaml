    - {at: "2026-11-22T15:15+01:00", what: "Stage II: 5 min live pitch + 5 min jury Q&A"}    # np. {at: "19:00", what: "golden path end-to-end"}, feature freeze

rules:              # sprawdza researcher PRZED startem
  url: https://hacknation.pl/api/public/dokumenty/28c74284-6390-4665-b8aa-bf4367db79c0/regulamin-hacknation_19.11.pdf
  task_docs: ["PCI - Regulamin zadania konkursowego.pdf", "PCI - Pełna treść zadania konkursowego.pdf"]   # publikowane na hacknation.pl (regulamin §5 ust. 4)
  allowed_ai: true              # proposed: ani regulamin wydarzenia, ani regulamin zadania nie zabraniają; treść §5 wprost przewiduje AI/ML w rozwiązaniu (trzeba podać źródła danych, założenia, ograniczenia)
  allowed_autonomous_agents: true   # proposed: brak zakazu w obu regulaminach; do potwierdzenia u mentorów (Q-003)
  task_notes: "proposed: Regulamin zadania ma pierwszeństwo nad regulaminem wydarzenia (§5 ust. 2). Etap I: jury PCI (min. 3 os.) ocenia zgłoszenia, ranking wg średniej; mentorzy obserwują pracę i ich opinia może wpłynąć na werdykt (§2 ust. 7). Do etapu II wchodzi TOP 3 (nie 5), pitch 5 min oceniany tylko za wystąpienie; wygrywa 1. miejsce etapu II. Jedna nagroda 11 111,00 zł brutto (minus 10% podatku), dzielona równo w zespole. Wypłata dopiero po przekazaniu pełnego kodu źródłowego z dokumentacją i udostępnieniu na EUPL-1.2 (§3 ust. 5); brak = dyskwalifikacja. Zwycięskie rozwiązanie trafia do publicznego repo Ministerstwa Cyfryzacji na GitHubie z licencją i autorami (§4 ust. 5); prawa majątkowe zostają u autorów, PCI i MC korzystają na EUPL (§4 ust. 6-7). Zakaz elementów, których licencja blokuje publikację na EUPL (§4 ust. 8) -> sprawdzać licencje zależności i danych. Zgoda na publikację na EUPL jest nieodwołalna (§1 ust. 10)."
  notes: "Teams up to 6. Per-task criteria come with the full brief (Sat 11:00). Stage I = jury (3+) scores Hacktribe submissions, top 5 per task go to Stage II = 5 min pitch + 5 min Q&A. Jury may award nothing below 50% of points. Prize per task 11-34k PLN. Task regulamin may transfer IP to the partner (art. 921 par. 3 kc): check it."

deliverables:       # co trzeba oddać — researcher sprawdza w regulaminie; nie zakładaj niczego (null = nieznane)
  video_required: true          # proposed: treść §4, link do filmu w dostępnym, otwartym repozytorium
  video_max_seconds: 180        # proposed: treść §4 („maksymalnie 3 minuty”, pokazuje działanie projektu)
  live_demo: true              # Stage II is a live pitch to the jury
  slides: "PDF, max 10 slajdów"  # proposed: treść §4
  repo_submission: optional     # proposed: treść §4 „dodatkowo może zawierać”; zwycięzca MUSI oddać pełny kod + dokumentację (regulamin §3 ust. 5)
  required_texts: [tytuł projektu, opis problemu i proponowanego rozwiązania, opis sposobu działania i głównych funkcji]   # proposed: treść §4
  optional_items: [repozytorium kodu, działający prototyp/demonstrator, zrzuty ekranu, link do demonstracji, grafiki/makiety/modele]   # proposed: treść §4
  ai_disclosure: "źródła danych, podstawowe założenia działania, ograniczenia (gdy są dane/AI/rekomendacje/integracje)"   # proposed: treść §5
  license: EUPL-1.2             # proposed: regulamin §1 ust. 10, §3 ust. 5, §4 ust. 5
  starter_code_allowed: null    # czy wolno użyć kodu przygotowanego przed eventem
  ai_apis_allowed: true         # proposed: brak zakazu; treść §5 dopuszcza AI/ML i integracje zewnętrzne (z opisem ograniczeń)
  external_data_allowed: true   # proposed: treść §7 sama podaje bazy zewnętrzne; uwaga na licencje danych (regulamin §4 ust. 8)
  cloud_deploy_allowed: null    # nic o tym nie mówią; treść §4 dopuszcza „link do demonstracji”
  format: null                  # optimize: .py / .onnx / zip / plik wyników …

mode: copilot       # copilot (pytaj o trudne decyzje) | autopilot (decyduj sam, pytaj tylko w końcówce)

limits:
  max_parallel_agents: 3
  ideas_per_round: 5
  codex_reviews_per_day: 4  # house review: Codex reviews per day (Codex limits are smaller); then Claude
  stagnation_n: 3   # iteracje bez poprawy → wymuszona zmiana kierunku

submissions:
  auto_submit: true     # wysyłaj sam, gdy jest podstawa sądzić, że poprawi wynik
  slots_total: null     # limit zgłoszeń (np. na dzień), z regulaminu
  explore_share: 0.25   # część slotów na nowe/nieprzetestowane podejścia
  endgame_share: 0.20   # ostatnie 20% czasu: pytaj przed każdym zgłoszeniem

deploy: true        # czy wolno samemu wystawić publiczne demo

architecture:       # człowiek, D-003 (2026-11-21); szczegóły w reports/ideation-2.md „Architektura”
  deploy: "Kubernetes, Helm chart (jeden chart, values per środowisko); lokalnie i dla jury: k3d/kind albo docker compose z tych samych obrazów"
  queue: "RabbitMQ jako broker + Celery workery, jedna kolejka na etap potoku"
  no_skip: "acks_late + reject_on_worker_lost, idempotentne zadania po (source, record_id), retry z backoff, dead-letter queue, uzgadnianie liczników pobrane = przetworzone + DLQ, walidacja schematu wyniku LLM z ponowieniem"
  dedup: "etap przed LLM (D-007): 1) ten sam rekord: (source, record_id) + content_hash; 2) ten sam obiekt w kilku źródłach: DOI, numer patentu/rodzina, kod projektu, identyfikator organizacji; 3) prawie duplikaty: ujednolicony tytuł + rok + organizacja, MinHash na abstrakcie; 4) semantycznie: embeddingi, próg do przeglądu; wynik: klaster z rekordem kanonicznym i zapisanym powodem"
  llm: "adapter z interfejsem (extract, classify, score_explain, embed); dostawca główny + zapasowy z konfiguracji; ostatni fallback offline (reguły + słowa kluczowe), żeby demo działało bez klucza"

