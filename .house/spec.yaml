# Specyfikacja konkursu — centralny dokument. Wypełniasz Ty; luki uzupełnia coordinator
# z regulaminu/treści zadania i oznacza je `proposed: true` do Twojego zatwierdzenia.
# Agenci czytają ten plik na starcie każdej sesji.

contest:            # człowiek
  name: HackNation 2026 - RADAR INNOWACJI (Podkarpackie Centrum Innowacji)
  url: https://hacknation.pl/zadania
  organizer: Podkarpackie Centrum Innowacji (task partner and jury); event by Ministerstwo Cyfryzacji / GovTech Polska / Miasto Bydgoszcz
  language: pl
  prize: 11111.11 PLN (main prize)

kind: build         # build | optimize — człowiek

goal: "Wsrod lokalnych pomyslow ze szkol, uczelni, samorzadow i instytucji publicznych znalezc te, ktore moga miec znaczenie daleko poza miejscem, w ktorym powstaly, i ustalic, co je wyroznia. (teaser ze strony; pelna tresc zadania 21.11 11:00)"
goal_full: >-   # proposed: z pełnej treści zadania §2-§3, §6, §9
  Prototyp, który systematycznie odnajduje „ukryte” innowacje ze szkół, uczelni, JST i innych instytucji
  publicznych (także nietechnologiczne: organizacyjne, edukacyjne, społeczne, procesowe), porządkuje
  informacje o pomyśle i twórcach, ocenia potencjał według jawnych kryteriów, rekomenduje ścieżkę
  (rozwój / transfer / komercjalizacja / wdrożenie w innej organizacji), wykrywa podobne rozwiązania
  (mniej dublowania prac) i łączy twórców z użytkownikami, partnerami lub inwestorami. Forma otwarta.
  Mile widziane mechanizmy: zgłaszanie lub automatyczne wykrywanie; uporządkowanie informacji; ocena
  wg jasnych kryteriów; rekomendacja ścieżki; wyszukiwanie podobnych; łączenie z odbiorcami.
  Walidacja: scenariusz a) wprowadzenie/wykrycie innowacji, b) uporządkowanie informacji, c) ocena
  potencjału, d) wskazanie odbiorców/partnerów/ścieżek, e) uzasadnienie rekomendacji + oczekiwane
  mierniki skuteczności; na co najmniej dwóch przykładowych przypadkach użycia.
  Nacisk: działa w wielu typach instytucji, powtarzalny proces oceny, jasne „co dalej” po identyfikacji,
  użyteczność po hackathonie.
users: ["pracownicy i przedstawiciele szkół, uczelni, JST i innych instytucji publicznych", "podmioty szukające gotowych lub rozwijających się rozwiązań"]   # proposed: treść §3
