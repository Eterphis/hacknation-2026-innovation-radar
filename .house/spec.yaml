scoring:            # build: rubryka; optimize: metryka + sprawdzarka — z regulaminu
  rubric:           # proposed: treść §8 + regulamin zadania §2 ust. 4-5 (etap I, 0-5 pkt każde, wagi po 20%, max 25)
    - {name: "Związek z wyzwaniem i jakość rozwiązania problemu", weight: 0.2, max: 5, what: "czy realnie wspiera odnajdywanie i ocenę ukrytych innowacji i prowadzi od identyfikacji do ścieżki rozwoju/wdrożenia (treść §6)"}
    - {name: "Pomysł i oryginalność", weight: 0.2, max: 5, what: "nowe podejście do wykrywania, oceny i łączenia innowacji"}
    - {name: "Użyteczność dla użytkowników i jakość doświadczenia", weight: 0.2, max: 5, what: "dla pracowników szkół, uczelni, JST, instytucji publicznych i szukających rozwiązań"}
    - {name: "Kompletność oraz jakość prototypu/demonstracji", weight: 0.2, max: 5, what: "działający prototyp, scenariusz a-e na min. 2 przypadkach, film"}
    - {name: "Potencjał wdrożeniowy, skalowalność i możliwość transferu innowacji", weight: 0.2, max: 5, what: "wiele organizacji, bezpieczeństwo danych, integracje, przejrzystość kryteriów, rozwój po hackathonie (treść §5, §9)"}
  rubric_stage2:    # proposed: regulamin zadania §2 ust. 8-9 (TOP 3, pitch 5 min; ocena samego wystąpienia)
    - {name: "Spójność prezentacji", weight: 0.2, max: 5}
    - {name: "Jasność przekazu", weight: 0.2, max: 5}
    - {name: "Umiejętność zainteresowania odbiorcy", weight: 0.2, max: 5}
    - {name: "Pomysłowość w zaprezentowaniu rozwiązania", weight: 0.2, max: 5}
    - {name: "Charyzma w wystąpieniu", weight: 0.2, max: 5}
  winner: "1. miejsce w rankingu etapu II (regulamin §2 ust. 9); nagroda nie jest przyznawana poniżej 50% punktów (§3 ust. 11)"   # proposed
  metric: null      # optimize: nazwa metryki i kierunek (max/min)
  direction: null   # optimize: max | min (house exp; bez tego bierze max/min ze słów w metric)
  local_scorer: null   # optimize: komenda lokalnej sprawdzarki; drukuje `score: <liczba>`
  scorer_files: []     # optimize: dodatkowe pliki sprawdzarki (globy), gdy nie wynikają z komendy (np. [eval/*.sh])
  leaderboard: null    # optimize: czy jest, gdzie, jak często się odświeża

timeline:           # z regulaminu
  start: "2026-11-21T11:00+01:00"   # full task briefs + criteria published, coding starts
  end: "2026-11-22T11:00+01:00"     # coding ends; submission on Hacktribe; later changes are ignored
