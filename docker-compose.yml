# `docker compose up --build` -> http://localhost:8000 (prawdziwe dane). Harvester zespołu: `docker compose --profile harvester up` zapisuje do ./data,
# a źródła `harvester-*` wciągają te pliki do kolejki. RADAR_DEMO_MODE=1 = tylko dane przykładowe. Klucze: .env.example -> .env.
x-radar: &radar
  build: ./app
  image: innovation-radar:dev
  env_file: [{ path: .env, required: false }]
  environment:
    RADAR_DATABASE_URL: postgresql+psycopg://radar:radar@postgres:5432/radar
    RADAR_BROKER_URL: amqp://radar:radar@rabbitmq:5672//
    RADAR_DEMO_MODE: ${RADAR_DEMO_MODE:-0}   # 1 = only synthetic snapshots (jury fallback without network)
    # local model -> rules; cloud models only with RADAR_LLM_ALLOW_CLOUD=1 (and anthropic/openai in the chain)
    RADAR_LLM_PROVIDERS: ${RADAR_LLM_PROVIDERS:-local,mock}
    RADAR_LLM_ALLOW_CLOUD: ${RADAR_LLM_ALLOW_CLOUD:-0}
    # set to http://llm:8080/v1 when running with `--profile local-llm`
    RADAR_LOCAL_LLM_URL: ${RADAR_LOCAL_LLM_URL:-}
    RADAR_LOCAL_LLM_TIMEOUT_S: ${RADAR_LOCAL_LLM_TIMEOUT_S:-300}
    # small model only for the guides' narrations (pipeline stays on rules): e.g. http://llm:8080/v1
    RADAR_GUIDE_LLM_URL: ${RADAR_GUIDE_LLM_URL:-}
    # hashing (default) | fastembed = multilingual-e5-small baked into the image (ONNX, CPU)
    RADAR_EMBEDDER: ${RADAR_EMBEDDER:-hashing}
    # USD per 1M tokens for radar_llm_cost_usd_total, e.g. {"anthropic":[3,15]}
    RADAR_LLM_PRICES: ${RADAR_LLM_PRICES:-}
    # outputs of the team harvester (radar/refresh.py) -> `harvester-*` sources in app/sources.yaml
    RADAR_HARVEST_DIR: /data/normalized
  volumes: ["./data:/data:ro"]
  depends_on:
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: radar, POSTGRES_PASSWORD: radar, POSTGRES_DB: radar }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U radar"], interval: 5s, retries: 20 }

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment: { RABBITMQ_DEFAULT_USER: radar, RABBITMQ_DEFAULT_PASS: radar }
    ports: ["15672:15672"]
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 10s, retries: 20 }

  api:
    <<: *radar
    ports: ["${RADAR_PORT:-8000}:8000"]

  worker-ingest:
    <<: *radar
    command: celery -A radar.pipeline.celery_app worker -Q harvest,normalize,resolve_org,dedup,gate,link -c 4 -n ingest@%h -E --loglevel=INFO
    healthcheck: { test: ["CMD-SHELL", "celery -A radar.pipeline.celery_app inspect ping -d ingest@$$HOSTNAME -t 10"], interval: 60s, timeout: 30s, retries: 3, start_period: 30s }

  worker-llm:
    <<: *radar
    command: celery -A radar.pipeline.celery_app worker -Q extract,maturity,score -c 2 -n llm@%h -E --loglevel=INFO
    healthcheck: { test: ["CMD-SHELL", "celery -A radar.pipeline.celery_app inspect ping -d llm@$$HOSTNAME -t 10"], interval: 60s, timeout: 30s, retries: 3, start_period: 30s }

  beat:
    <<: *radar
    command: celery -A radar.pipeline.celery_app beat --loglevel=INFO -s /tmp/celerybeat-schedule
    healthcheck: { disable: true }  # beat has no endpoint; a stopped beat restarts (restart: unless-stopped)

  # Small Polish LLM on CPU (no GPU): `RADAR_LOCAL_LLM_URL=http://llm:8080/v1 docker compose --profile local-llm up`
  # First start downloads the GGUF (~1.7 GB for Q8_0) into the llm-cache volume.
  llm:
    profiles: [local-llm]
    image: ghcr.io/ggml-org/llama.cpp:server
    command: ["-hf", "${RADAR_LOCAL_GGUF:-speakleash/Bielik-1.5B-v3.0-Instruct-GGUF:Q8_0}", "--host", "0.0.0.0", "--port", "8080",
              "-c", "4096", "-t", "${RADAR_LOCAL_THREADS:-4}", "--alias", "bielik-1.5b-v3.0-instruct"]
    volumes: [llm-cache:/root/.cache]
    ports: ["8081:8080"]

  # ---- observability: `docker compose --profile observability up` -> Grafana http://localhost:3000 (admin/admin),
  #      Prometheus :9090 (alerts: deploy/observability/alerts.yml), Flower :5555 (also scraped: /metrics)
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.55.1
    volumes: ["./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    profiles: [observability]
    image: grafana/grafana:11.6.0
    environment: { GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer, GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/radar.json }
    volumes: ["./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro", "./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro"]
    ports: ["3000:3000"]
  flower:
    profiles: [observability]
    image: mher/flower:2.0
    command: ["celery", "--broker=amqp://radar:radar@rabbitmq:5672//", "flower", "--port=5555"]
    ports: ["5555:5555"]
    depends_on: { rabbitmq: { condition: service_healthy } }

  # ---- harvester (radar/ in repo root, from feature/pobieranie-danych): `docker compose --profile harvester up`
  harvester-gui:
    profiles: [harvester]
    build: .
    image: innovation-radar-harvester:latest
    init: true
    command: ["gui"]
    volumes: ["./data:/app/data", "./config:/app/config:ro"]
    env_file: [{ path: .env, required: false }]
    ports: ["${HARVESTER_PORT:-8765}:8765"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/meta', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  harvester-scheduler:
    profiles: [harvester]
    build: .
    image: innovation-radar-harvester:latest
    init: true
    command: ["scheduler"]
    volumes: ["./data:/app/data", "./config:/app/config:ro"]
    env_file: [{ path: .env, required: false }]
    restart: unless-stopped

  # Public HTTPS on a VPS: docker compose --profile public up -d  (RADAR_DOMAIN=radar.example.pl in .env)
  caddy:
    image: caddy:2.8-alpine
    profiles: ["public"]
    depends_on: [api]
    ports: ["80:80", "443:443"]
    environment: { RADAR_DOMAIN: "${RADAR_DOMAIN:-localhost}" }
    volumes: ["./deploy/public/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data"]
    restart: unless-stopped

  # Public URL without a domain or open ports (jury, phone on LTE): `docker compose --profile tunnel up -d`
  # Quick tunnel by default (random https://*.trycloudflare.com, printed by `docker compose logs cloudflared`).
  # Fixed address: a named tunnel, RADAR_TUNNEL_CMD="tunnel --no-autoupdate run" and TUNNEL_TOKEN in .env (never in git).
  edge:
    image: caddy:2.8-alpine
    profiles: ["tunnel"]
    depends_on: [api]
    volumes: ["./deploy/public/Caddyfile.tunnel:/etc/caddy/Caddyfile:ro"]
    restart: unless-stopped
  cloudflared:
    image: cloudflare/cloudflared:2025.11.1
    profiles: ["tunnel"]
    depends_on: [edge]
    command: ${RADAR_TUNNEL_CMD:-tunnel --no-autoupdate --url http://edge:80}
    env_file: [{ path: .env, required: false }]   # TUNNEL_TOKEN for a named tunnel
    restart: unless-stopped

  # Nightly Postgres dump into ./backups (profile public); rotate old files with the host's own tooling
  backup:
    image: postgres:16-alpine
    profiles: ["public"]
    depends_on: [postgres]
    environment: { PGPASSWORD: radar }
    volumes: ["./backups:/backups"]
    entrypoint: ["sh", "-c", "while true; do pg_dump -h postgres -U radar radar | gzip > /backups/radar-$$(date +%F).sql.gz; sleep 86400; done"]
    restart: unless-stopped

volumes:
  pgdata:
  llm-cache:
  caddy-data:
