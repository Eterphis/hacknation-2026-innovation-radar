<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar Innowacji</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --ink:#1b1f24; --muted:#5f6b7a; --line:#e2e6eb; --accent:#0b5cad;
          --ok:#1f7a3d; --bad:#b42318; --warn:#9a6700; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --panel:#1a1f25; --ink:#e7ebf0; --muted:#9aa6b4;
          --line:#2a313a; --accent:#5aa2f0; --ok:#4cc27a; --bad:#f07a6e; --warn:#e0b44c; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:16px; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  nav button { background:none; border:0; padding:8px 10px; font:inherit; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; }
  nav button.on { color:var(--ink); border-color:var(--accent); }
  .badge { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
  .badge.demo { color:var(--warn); border-color:var(--warn); }
  main { display:grid; grid-template-columns: minmax(280px, 1fr) minmax(320px, 1.4fr); gap:16px; padding:16px 20px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; padding:12px 16px; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; min-width:0; }
  .list { display:flex; flex-direction:column; gap:8px; }
  .item { border:1px solid var(--line); border-radius:8px; padding:10px 12px; cursor:pointer; }
  .item:hover, .item.sel { border-color:var(--accent); }
  .item h3 { margin:0 0 4px; font-size:15px; }
  .meta { color:var(--muted); font-size:13px; display:flex; gap:8px; flex-wrap:wrap; }
  .lvl { font-weight:600; }
  .step { margin:12px 0; } .step h4 { margin:0 0 4px; font-size:14px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .step ul { margin:0; padding-left:18px; }
  .actions { display:flex; gap:8px; margin-top:12px; }
  .actions button, .src button { font:inherit; padding:6px 14px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
  .approve { border-color:var(--ok)!important; color:var(--ok)!important; } .reject { border-color:var(--bad)!important; color:var(--bad)!important; }
  table { border-collapse:collapse; width:100%; font-size:14px; } td, th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  .err { color:var(--bad); font-size:13px; word-break:break-word; }
  .empty { color:var(--muted); }
  .wide { grid-column: 1 / -1; }
</style>
</head>
<body>
<header>
  <h1>Radar Innowacji</h1>
  <nav id="nav">
    <button data-v="queue" class="on">Kolejka</button>
    <button data-v="review">Do przeglądu</button>
    <button data-v="sources">Źródła</button>
    <button data-v="stats">Liczniki</button>
  </nav>
  <span id="mode" class="badge"></span>
</header>
<main id="main"></main>
<script>
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = (p, o) => fetch(p, o).then(r => r.ok ? r.json() : r.text().then(t => Promise.reject(t)));
const LVL = {exploring:"badania", tech_ready:"technologia gotowa", business_ready:"gotowe do wdrożenia", market_ready:"na rynku"};
let view = "queue", selected = null;

document.getElementById("nav").onclick = e => { if (e.target.dataset.v) { view = e.target.dataset.v;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b === e.target)); render(); } };

api("/api/config").then(c => { const m = $("#mode"); m.textContent = c.demo_mode ? "tryb demo (snapshoty)" : "LLM: " + c.llm_providers.join(" → ");
  m.classList.toggle("demo", c.demo_mode); });

async function render() {
  const main = $("#main");
  if (view === "queue") {
    const cards = await api("/api/cards?decision=pending");
    main.innerHTML = `<section class="panel"><h2>Znalezione innowacje (${cards.length})</h2><div class="list">${
      cards.map(c => `<div class="item ${c.id===selected?'sel':''}" data-id="${c.id}"><h3>${esc(c.solution_name || c.record.title)}</h3>
        <div class="meta"><span class="lvl">${esc(LVL[c.maturity] || c.maturity)}</span><span>${esc(c.innovation_type)}</span>
        <span>${esc(c.record.source_id)}</span>${c.hidden?'<span>ukryta</span>':''}${c.provider==='mock'?'<span>ekstrakcja: heurystyka</span>':''}</div></div>`).join("")
      || '<p class="empty">Brak kart. Uruchom źródło w zakładce „Źródła”.</p>'}</div></section><section class="panel" id="detail"><p class="empty">Wybierz kartę.</p></section>`;
    main.querySelectorAll(".item").forEach(el => el.onclick = () => { selected = +el.dataset.id; showCard(selected);
      main.querySelectorAll(".item").forEach(x => x.classList.toggle("sel", x === el)); });
    if (selected) showCard(selected);
  } else if (view === "review") {
    const rows = await api("/api/review");
    main.innerHTML = `<section class="panel wide"><h2>Do przeglądu (${rows.length})</h2><table><tr><th>#</th><th>Źródło</th><th>Tytuł</th><th>Powody</th></tr>${
      rows.map(r => `<tr><td>${r.id}</td><td>${esc(r.source_id)}</td><td>${esc(r.title)}</td><td>${esc((r.reasons||[]).join("; "))}</td></tr>`).join("")}</table></section>`;
  } else if (view === "sources") {
    const src = await api("/api/sources");
    main.innerHTML = `<section class="panel wide"><h2>Źródła danych</h2><table><tr><th>Źródło</th><th>Typ</th><th>Rekordy</th><th>Ostatnie pobranie</th><th></th></tr>${
      src.map(s => `<tr class="src"><td><b>${esc(s.id)}</b><br><span class="meta">${esc(s.description)}</span>${s.last_error?`<div class="err">${esc(s.last_error)}</div>`:''}</td>
        <td>${esc(s.type)} · ${esc(s.mode)}${s.demo?' · demo':''}${s.active?'':' · nieaktywne'}</td><td>${s.records}</td>
        <td>${s.last_run_at ? esc(new Date(s.last_run_at).toLocaleString("pl-PL")) + " · " + esc(s.last_status) : "—"}</td>
        <td>${s.mode==='pull' && s.active ? `<button data-run="${esc(s.id)}">Pobierz</button>` : (s.type==='webhook' ? `<code>/api/ingest/webhook/${esc(s.id)}</code>` : '')}</td></tr>`).join("")}</table></section>`;
    main.querySelectorAll("[data-run]").forEach(b => b.onclick = async () => { b.disabled = true; b.textContent = "…";
      try { await api(`/api/sources/${b.dataset.run}/run`, {method:"POST"}); } catch (e) { alert(e); } setTimeout(render, 1500); });
  } else {
    const s = await api("/api/stats");
    const t = o => Object.entries(o).map(([k,v]) => `<tr><td>${esc(k)}</td><td>${typeof v === 'object' ? esc(Object.entries(v).map(([a,b])=>a+": "+b).join(", ")) : v}</td></tr>`).join("");
    main.innerHTML = `<section class="panel"><h2>Rekordy wg statusu</h2><table>${t(s.records_by_status)}</table><h2>Pobrane wg kanału</h2><table>${t(s.raw_by_transport)}</table></section>
      <section class="panel"><h2>Etapy potoku</h2><table>${t(s.stages)}</table><h2>Decyzje</h2><table>${t(s.cards_by_decision)}</table></section>`;
  }
}

async function showCard(id) {
  const c = await api(`/api/cards/${id}`), d = $("#detail"); if (!d) return;
  d.innerHTML = `<h2>${esc(c.solution_name || c.record.title)}</h2>
    <div class="meta"><span class="lvl">${esc(LVL[c.maturity] || c.maturity)}</span><span>${esc(c.innovation_type)}</span>
    <span>${esc(c.record.source_id)}</span>${c.record.year?`<span>${c.record.year}</span>`:''}${c.record.url?`<a href="${esc(c.record.url)}" target="_blank" rel="noopener">źródło</a>`:''}</div>
    <p>${esc(c.summary_pl)}</p>
    ${(c.reasoning||[]).map(s => `<div class="step"><h4>${esc(s.step)}</h4><ul>${s.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}
    <div class="actions"><button class="approve" data-d="approved">Zatwierdź</button><button class="reject" data-d="rejected">Odrzuć</button></div>`;
  d.querySelectorAll("[data-d]").forEach(b => b.onclick = async () => {
    await api(`/api/cards/${id}/decision`, {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({decision: b.dataset.d})});
    selected = null; render(); });
}
render();
</script>
</body>
</html>
