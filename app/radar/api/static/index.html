  --q1:#184f95; --q2:#256abf; --q3:#3987e5; --q4:#86b6ef; } }

};

const ROUTES = {"": pageHome, "odkrywaj": pageExplore, "graf": pageGraph, "mapa": pageMap, "rolki": pageReels, "zglos": pageSubmit, "operator": pageOperator};
async function route() {
  const [path, query] = location.hash.replace(/^#\/?/, "").split("?");
  if (query) F = Object.fromEntries(new URLSearchParams(query));
  $$("#tabs a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#/" + path));
  const v = $("#view"); v.style.opacity = 0;
  v.innerHTML = '<div class="skel" style="width:40%;height:2.5rem"></div><div class="skel"></div><div class="skel" style="width:70%"></div>';
  v.style.transition = "opacity .2s ease-out"; requestAnimationFrame(() => v.style.opacity = 1);

const go = (path, filters) => { F = filters || {}; const q = qs(F); location.hash = "#/" + path + (q ? "?" + q : ""); };

function drawPortfolio(el, pts) {

  const W = 640, H = 420, L = 56, R = 12, T = 16, B = 44, cw = (W - L - R) / 4, ch = (H - T - B) / 4;
  const cell = {}, r = s => 4 + Math.max(0, (s - 40)) / 12;
  const pos = pts.map(p => { const key = p.cost_i + ":" + p.maturity_i, i = cell[key] = (cell[key] || 0) + 1;
    const ang = i * 2.399, rad = Math.min(11 * Math.sqrt(i - 1), Math.min(cw, ch) / 2 - 10);   // sunflower packing inside the cell, deterministic
    return {...p, x: L + (p.cost_i + .5) * cw + Math.cos(ang) * rad, y: T + (3 - p.maturity_i + .5) * ch + Math.sin(ang) * rad}; });
  const Q = [["Szybkie wygrane", "tanio i już działa", L + 4, T + 14], ["Do skalowania", "działa, ale drogo", L + 2 * cw + 4, T + 14],
             ["Do przetestowania", "tanio, wczesny etap", L + 4, T + 2 * ch + 14], ["Duże zakłady", "drogo i wcześnie", L + 2 * cw + 4, T + 2 * ch + 14]];
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Portfel pomysłów: koszt wdrożenia na osi poziomej, dojrzałość na pionowej">
    ${[0,1,2,3,4].map(i => `<line class="gridl" x1="${L + i * cw}" x2="${L + i * cw}" y1="${T}" y2="${H - B}"/><line class="gridl" x1="${L}" x2="${W - R}" y1="${T + i * ch}" y2="${T + i * ch}"/>`).join("")}
    <line x1="${L + 2 * cw}" x2="${L + 2 * cw}" y1="${T}" y2="${H - B}" stroke="var(--ink-3)" stroke-dasharray="3 4"/><line x1="${L}" x2="${W - R}" y1="${T + 2 * ch}" y2="${T + 2 * ch}" stroke="var(--ink-3)" stroke-dasharray="3 4"/>
    ${Q.map(q => `<text class="ql" x="${q[2]}" y="${q[3]}">${q[0]}</text><text class="qd" x="${q[2]}" y="${q[3] + 14}">${q[1]}</text>`).join("")}
    ${COST.map((c, i) => `<text class="axis" x="${L + (i + .5) * cw}" y="${H - B + 18}" text-anchor="middle">${c}</text>`).join("")}
    <text class="axis" x="${L + 2 * cw}" y="${H - 6}" text-anchor="middle">KOSZT WDROŻENIA →</text>
    ${LVL.map((l, i) => `<text class="axis" x="${L - 8}" y="${T + (3 - i + .5) * ch + 4}" text-anchor="end">${["bad.", "techn.", "wdroż.", "rynek"][i]}</text>`).join("")}
    <text class="axis" transform="translate(12 ${T + 2 * ch}) rotate(-90)" text-anchor="middle">DOJRZAŁOŚĆ →</text>
    ${pos.map((p, i) => `<circle data-i="${i}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r(p.score).toFixed(1)}" fill="${secColor(p.sector)}" stroke="var(--surface)" stroke-width="2" style="cursor:pointer"/>`).join("")}
  </svg>`;
  $$("circle", el).forEach(c => { const p = pos[+c.dataset.i];
    c.onmousemove = e => tip(`<b>${esc(p.title)}</b><br>${esc(p.sector_pl)} · ${esc(p.voivodeship || "—")}<br>wynik ${Math.round(p.score)} · koszt ${COST[p.cost_i]} · ${LVL[p.maturity_i]}`, e);
    c.onmouseleave = () => tip(); c.onclick = () => openCard(p.card_id); });
  const used = [...new Set(pts.map(p => SECTOR_SLOT[p.sector] ? p.sector : "_"))].sort((a, b) => (SECTOR_SLOT[a] || 9) - (SECTOR_SLOT[b] || 9));
  $("#plegend").innerHTML = used.map(s => `<span><i class="dot" style="background:${s === "_" ? "var(--other)" : secColor(s)}"></i>${esc(s === "_" ? "inne sektory" : lp("sector", s))}</span>`).join("") + `<span class="faint">wielkość = wynik</span>`;
  $("#ptable").innerHTML = `<table class="t"><tr><th>Pomysł</th><th>Koszt</th><th>Dojrzałość</th><th>Wynik</th></tr>${pts.slice().sort((a, b) => b.score - a.score).map(p => `<tr><td><a href="#" data-card="${p.card_id}">${esc(p.title)}</a></td><td>${COST[p.cost_i]}</td><td>${LVL[p.maturity_i]}</td><td class="mono">${Math.round(p.score)}</td></tr>`).join("")}</table>`;
  $$("#ptable [data-card]").forEach(a => a.onclick = e => { e.preventDefault(); openCard(+a.dataset.card); });
}

function drawGraph(g) {
  const cv = $("#graph"), ctx = cv.getContext("2d"), dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement), C = n => css.getPropertyValue(n).trim();
  const color = n => n.type === "idea" ? C(SECTOR_SLOT[n.sector] ? `--s${SECTOR_SLOT[n.sector]}` : "--other") : C("--ink-3");
  const idx = new Map(g.nodes.map((n, i) => [n.id, i]));
  const N = g.nodes.map((n, i) => ({...n, x: W / 2 + Math.cos(i * 2.399) * 12 * Math.sqrt(i + 1), y: H / 2 + Math.sin(i * 2.399) * 12 * Math.sqrt(i + 1), vx: 0, vy: 0, deg: 0}));
  const Lk = g.links.filter(l => idx.has(l.source) && idx.has(l.target)).map(l => ({...l, s: N[idx.get(l.source)], t: N[idx.get(l.target)]}));
  Lk.forEach(l => { l.s.deg++; l.t.deg++; });
  const sim = l => l.kind === "similar" || l.kind === "possible_duplicate";
  const rad = n => n.type === "idea" ? 4 + (n.score || 40) / 22 : 5 + Math.sqrt(n.deg) * 2.4;
  let alpha = 1, drag = null, hover = null, ox = 0, oy = 0, sc = 1, fitted = false, pan = null, moved = false;
  function tick() {
    for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) { const a = N[i], b = N[j]; let dx = b.x - a.x, dy = b.y - a.y; const d2 = dx * dx + dy * dy + .01; if (d2 > 90000) continue;
      const f = 1100 / d2 * alpha; dx *= f; dy *= f; a.vx -= dx; a.vy -= dy; b.vx += dx; b.vy += dy; }
    for (const l of Lk) { const dx = l.t.x - l.s.x, dy = l.t.y - l.s.y, d = Math.hypot(dx, dy) || 1, k = (d - (sim(l) ? 60 : 105)) / d * .045 * alpha * (sim(l) ? 1.5 : 1);
      l.s.vx += dx * k; l.s.vy += dy * k; l.t.vx -= dx * k; l.t.vy -= dy * k; }
    for (const n of N) { if (n === drag) continue; n.vx += (W / 2 - n.x) * .006 * alpha; n.vy += (H / 2 - n.y) * .006 * alpha; n.x += n.vx; n.y += n.vy; n.vx *= .6; n.vy *= .6; }
    alpha = Math.max(alpha * .985, .02); if (!fitted && alpha < .15) { fit(); fitted = true; }
  }
  function fit() { const xs = N.map(n => n.x), ys = N.map(n => n.y), x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);

  const near = n => hover && (n === hover || Lk.some(l => (l.s === hover && l.t === n) || (l.t === hover && l.s === n)));
  function paint() {
    ctx.clearRect(0, 0, W, H); ctx.save(); ctx.translate(ox, oy); ctx.scale(sc, sc);

      ctx.beginPath(); ctx.moveTo(l.s.x, l.s.y); ctx.lineTo(l.t.x, l.t.y); ctx.stroke(); }
    ctx.globalAlpha = 1;
    for (const n of N) { ctx.globalAlpha = hover && !near(n) ? .3 : 1; ctx.beginPath(); ctx.arc(n.x, n.y, rad(n), 0, 7);
      ctx.fillStyle = n.type === "idea" ? color(n) : C("--surface"); ctx.fill(); ctx.lineWidth = n.type === "idea" ? 2 / sc : 1.5 / sc; ctx.strokeStyle = n.type === "idea" ? C("--surface") : C("--ink-3"); ctx.stroke();
      if (n.type !== "idea" || n === hover || sc > 1.4) { ctx.fillStyle = n.type === "idea" ? C("--ink") : C("--ink-2"); ctx.font = `${n.type === "idea" ? 400 : 600} ${12 / Math.sqrt(sc)}px system-ui`; ctx.fillText(n.label.slice(0, 46), n.x + rad(n) + 4, n.y + 4); } }
    ctx.restore(); ctx.globalAlpha = 1;

  (function loop() { if (alpha > .021 || drag) tick(); paint(); if (document.body.contains(cv)) requestAnimationFrame(loop); })();
  const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left - ox) / sc, (e.clientY - r.top - oy) / sc]; };

    if (drag) { drag.x = x; drag.y = y; alpha = Math.max(alpha, .3); moved = true; } else if (pan) { ox = e.clientX - pan[0]; oy = e.clientY - pan[1]; moved = true; }
    else { hover = hit(x, y) || null; cv.style.cursor = hover ? "pointer" : "grab"; tip(hover ? `<b>${esc(hover.label)}</b>${hover.type === "idea" ? `<br>${esc(lp("sector", hover.sector))} · ${esc(hover.voivodeship || "—")}${hover.score ? " · wynik " + Math.round(hover.score) : ""}` : `<br>${hover.deg} powiązań`}` : "", e); } };
  cv.onpointerleave = () => { hover = null; tip(); };
  cv.onpointerup = () => { if (drag && !moved) { const n = drag; if (n.type === "idea" && n.card_id) openCard(n.card_id); else if (n.type !== "idea") go("graf", {[n.type]: n.id.split(":").slice(1).join(":")}); } drag = null; pan = null; };
  cv.onwheel = e => { e.preventDefault(); const k = e.deltaY < 0 ? 1.1 : .9, r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top; ox = mx - (mx - ox) * k; oy = my - (my - oy) * k; sc *= k; };
  const used = [...new Set(N.filter(n => n.type === "idea").map(n => SECTOR_SLOT[n.sector] ? n.sector : "_"))].sort((a, b) => (SECTOR_SLOT[a] || 9) - (SECTOR_SLOT[b] || 9));
  $("#glegend").innerHTML = used.map(s => `<span><i class="dot" style="background:${s === "_" ? "var(--other)" : secColor(s)}"></i>${esc(s === "_" ? "inne sektory" : lp("sector", s))}</span>`).join("") +
    `<span><i class="dot" style="background:var(--surface);border:1.5px solid var(--ink-3)"></i>hub</span><span><i class="dot" style="background:var(--accent);height:2px;width:14px;border-radius:1px"></i>podobna treść</span>`;
}

    ${c.record.affiliations?.length ? `<p class="faint">${esc(c.record.affiliations.join("; "))}${c.record.url ? ` · <a href="${esc(c.record.url)}" target="_blank" rel="noopener">źródło</a>` : ""}</p>` : ""}
    ${a.scores ? `<div class="sec"><p class="eyebrow">Ocena wg jawnych kryteriów</p><div class="crit">${Object.entries(a.scores).map(([k, x]) => `<span>${esc(CRIT[k] || k)} <span class="faint">${Math.round((a.criteria?.[k]?.weight || 0) * 100)}%</span></span><div class="mini"><i style="width:${x.score * 20}%"></i></div><b class="mono">${x.score}</b><span class="why">${esc(x.why)}</span>`).join("")}</div></div>` : ""}
    ${a.paths ? `<div class="sec"><p class="eyebrow">Ścieżki wdrożenia · kto co robi</p>${a.paths.map(p => `<p style="margin:.75rem 0 .25rem"><b>${esc(p.path)}</b> <span class="faint">${esc(p.why)}</span></p><ul class="steps">${p.steps.map(s => `<li>${esc(s.step)}<span class="who">${esc(s.who)}${s.time ? " · " + esc(s.time) : ""}</span></li>`).join("")}</ul>`).join("")}</div>` : ""}
    ${a.recipients ? `<div class="sec"><p class="eyebrow">Odbiorcy i partnerzy</p><ul class="steps">${a.recipients.map(r => `<li><b>${esc(r.name)}</b><span class="who">${esc(r.kind)} · ${esc(r.why)}</span></li>`).join("")}</ul></div>` : ""}
    ${a.risks ? `<div class="sec"><p class="eyebrow">Ryzyka i mitygacje</p><ul class="steps">${a.risks.map(r => `<li>${esc(r.risk)} <span class="faint">(${esc(r.level || "")})</span><span class="who">mitygacja: ${esc(r.mitigation)} · ${esc(r.owner)}</span></li>`).join("")}</ul></div>` : ""}
    ${a.metrics ? `<div class="sec"><p class="eyebrow">Oczekiwane mierniki skuteczności</p><ul class="steps">${a.metrics.map(m => `<li>${esc(m)}</li>`).join("")}</ul></div>` : ""}
    <details class="rule sec"><summary>Podobne rozwiązania, kontekst regionu i dowody</summary>
      ${a.similar?.length ? `<p class="eyebrow" style="margin-top:1rem">Podobne (ryzyko dublowania)</p><ul class="steps">${a.similar.map(s => `<li>${s.card_id ? `<a href="#" data-card="${s.card_id}">${esc(s.title)}</a>` : esc(s.title)}<span class="who">podobieństwo ${s.similarity}${s.voivodeship ? " · " + esc(s.voivodeship) : ""}</span></li>`).join("")}</ul>` : ""}
      ${a.regional_context ? `<p class="eyebrow" style="margin-top:1rem">Region</p><p>${esc(a.regional_context.voivodeship || "—")}: ${a.regional_context.ideas_in_region_sector ?? 0} pomysłów w sektorze (średnio ${a.regional_context.national_avg_per_region} na województwo); ${a.regional_context.regions_without_supply?.length || 0} województw bez podobnej podaży.</p>` : ""}
      ${(c.reasoning || []).slice(0, 1).map(s => `<p class="eyebrow" style="margin-top:1rem">${esc(s.step)}</p><ul class="steps">${s.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`).join("")}
      ${a.recheck?.length ? `<p class="eyebrow" style="margin-top:1rem">Basal: kontrola spójności</p><ul class="steps">${a.recheck.map(w => `<li>${esc(w)}</li>`).join("")}</ul>` : ""}
      <p class="who" style="margin-top:1rem">ocena: ${esc(a.by || "")} · ekstrakcja: ${esc(c.provenance?.provider)}/${esc(c.provenance?.model)} · basal: ${esc(c.basal?.version)} (${esc(c.basal?.embedder)})</p></details>
    <div style="display:flex;gap:.5rem;margin-top:2rem;flex-wrap:wrap"><button class="ghost good" data-d="approved">Zatwierdź</button><button class="ghost bad" data-d="rejected">Odrzuć</button><span class="faint" style="align-self:center">decyzja: ${esc(c.decision)}</span></div>`;
  $("#dclose").onclick = closeCard;
  $$("[data-card]", $("#drawer-in")).forEach(x => x.onclick = e => { e.preventDefault(); openCard(+x.dataset.card); });
  $$("[data-d]", $("#drawer-in")).forEach(b => b.onclick = async () => { await api(`/api/cards/${id}/decision`, {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({decision: b.dataset.d})}); closeCard(); route(); });
}
function closeCard() { $("#scrim").classList.remove("on"); $("#drawer").classList.remove("on"); }
$("#scrim").onclick = closeCard;

// ------------------------------------------------------------------ command bar + voice (progressive, feature-detected)
const cmd = $("#cmd"), cq = $("#cmdq");
function openCmd() { cmd.classList.add("on"); cq.value = ""; cq.focus();
  $("#hints").innerHTML = ["seniorzy", "smog", "kompozyty", "e-usługi", "edukacja", "wodór"].map(h => `<button class="chip" data-h="${h}">${h}</button>`).join("") +
    Object.entries({"": "Przegląd", odkrywaj: "Odkrywaj", graf: "Graf", mapa: "Mapa", rolki: "Rolki", zglos: "Zgłoś"}).map(([p, n]) => `<button class="chip" data-p="${p}">${n}</button>`).join("");
  $$("[data-h]", cmd).forEach(b => b.onclick = () => search(b.dataset.h)); $$("[data-p]", cmd).forEach(b => b.onclick = () => { cmd.classList.remove("on"); go(b.dataset.p, {}); }); }
function search(q) { cmd.classList.remove("on"); go("odkrywaj", {q}); }
$("#cmdbtn").onclick = openCmd;
cmd.onclick = e => { if (e.target === cmd) cmd.classList.remove("on"); };
cq.onkeydown = e => { if (e.key === "Enter" && cq.value.trim()) search(cq.value.trim()); if (e.key === "Escape") cmd.classList.remove("on"); };
document.addEventListener("keydown", e => { if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); openCmd(); } if (e.key === "Escape") { closeCard(); cmd.classList.remove("on"); } });
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) { const mic = $("#mic"); mic.hidden = false; mic.onclick = () => { const r = new SR(); r.lang = "pl-PL"; r.interimResults = false; mic.classList.add("on");
  r.onresult = e => { const t = e.results[0][0].transcript; cq.value = t; search(t); }; r.onend = () => mic.classList.remove("on"); r.start(); }; }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

// ------------------------------------------------------------------ boot
Promise.all([api("/api/config").then(c => CFG = c).catch(() => {}), api("/api/labels").then(l => LABELS = l).catch(() => {})]).then(() => {
  const m = $("#mode"); m.textContent = CFG.demo_mode ? "tryb demo" : "LLM: " + (CFG.llm_providers || []).join(" → "); m.classList.toggle("demo", !!CFG.demo_mode);
  route(); });
</script>
</body>
</html>
