# Źródła danych radaru. Nowe źródło REST / GraphQL / webhook / pub-sub = nowy wpis tutaj, bez kodu.
# Nowy protokół = jedna klasa w radar/sources + radar.sources.registry.register().
#
# Wspólne pola:
#   id, type (rest | graphql | oaipmh | sparql | snapshot | webhook | amqp | gcp_pubsub | kafka)
#   enabled, demo (działa bez sieci i kluczy; w RADAR_DEMO_MODE=1 tylko te), schedule_s (co ile sekund pobierać)
#   kind: publication | project | patent | beneficiary | solution
#   record_path / id_path: JMESPath do listy rekordów i ich identyfikatora
#   mapping: pole_rekordu -> JMESPath albo {expr, transform: [first|pl_decimal|year|doi|strip_html|join|list]}
#   options: zależne od typu; ${ZMIENNA} bierze wartość ze środowiska (sekrety z Helm Secret)
#
# W Helm ten plik jest w values.yaml (`sources:`) i trafia do ConfigMap.

sources:
  # ------------------------------------------------------------------ DEMO (snapshoty, dane syntetyczne)
  - id: demo-publikacje
    type: snapshot
    demo: true
    kind: publication
    description: "Przykładowe publikacje (dane syntetyczne, format Biblioteki Nauki po parsowaniu OAI)"
    options: { path: samples/publikacje.jsonl, min_abstract_chars: 120 }
    id_path: oai_identifier
    mapping:
      title: { expr: title, transform: first }
      abstract: { expr: description, transform: first }
      authors: creator
      affiliations: affiliation
      keywords: subject
      year: { expr: date, transform: year }
      doi: { expr: identifier, transform: doi }
      url: { expr: relation, transform: first }
      licence: { expr: rights, transform: first }
      language: { expr: language, transform: first }
      synthetic: synthetic

  - id: demo-kohesio
    type: snapshot
    demo: true
    kind: project
    description: "Przykładowe projekty spójności (dane syntetyczne w kształcie odpowiedzi Kohesio)"
    options: { path: samples/kohesio.json, min_abstract_chars: 120 }
    record_path: list
    id_path: item
    mapping:
      title: { expr: label, transform: first }
      abstract: { expr: description, transform: first }
      affiliations: beneficiaries
      region: { expr: regionText, transform: first }
      year: { expr: startTime, transform: year }
      amount_eu: { expr: euBudgets, transform: pl_decimal }
      amount_total: { expr: totalBudgets, transform: pl_decimal }
      start: { expr: startTime, transform: first }
      end: { expr: endTime, transform: first }
      objective: { expr: objectiveIds, transform: first }
      implementation: { const: true }
      synthetic: synthetic

  - id: demo-zgloszenia
    type: snapshot
    demo: true
    kind: solution
    description: "Przykładowe zgłoszenia ze szkół, uczelni, JST i instytucji (dane syntetyczne)"
    options: { path: samples/zgloszenia.jsonl, min_abstract_chars: 120 }
    id_path: id
    mapping:
      title: title
      abstract: description
      affiliations: "[institution]"
      region: region
      keywords: keywords
      institution_type: institution_type
      synthetic: synthetic

  # ------------------------------------------------------------------ PUSH: zgłoszenia ręczne / webhook
  - id: zgloszenia
    type: webhook
    demo: true
    kind: solution
    description: "Zgłoszenia innowacji (formularz /api/ingest/zgloszenia/manual albo webhook z systemów instytucji)"
    options: { min_abstract_chars: 80 }
    id_path: id
    mapping:
      title: title
      abstract: description
      affiliations: "[institution]"
      region: region
      keywords: keywords
      url: url
      institution_type: institution_type

  # ------------------------------------------------------------------ LIVE: pull
  # Biblioteka Nauki i RAD-on: jedna droga = harvester (harvester-bibliotekanauki, harvester-radon niżej). Jego konektory
  # mają więcej pól (oai_openaire: słowa kluczowe, afiliacje, DOI; RAD-on: filtr NCN/NCBR, organizacje z REGON/typem/
  # województwem i rejestr instytucji dla resolve_org). Te wpisy zostają jako wzór konfiguracji, wyłączone.
  - id: bibliotekanauki
    type: oaipmh
    enabled: false   # zastąpione przez harvester-bibliotekanauki
    kind: publication
    schedule_s: 21600
    description: "Biblioteka Nauki, OAI-PMH, przyrostowo po datestamp"
    options:
      base_url: https://bibliotekanauki.pl/api/oai/articles
      metadata_prefix: oai_dc
      from: "2026-10-01"
      max_pages: 5
      timeout: 60
    mapping:
      title: { expr: title, transform: first }
      abstract: { expr: description, transform: first }
      authors: creator
      keywords: subject
      year: { expr: date, transform: year }
      doi: { expr: identifier, transform: doi }
      url: { expr: identifier, transform: first }
      licence: { expr: rights, transform: first }
      language: { expr: language, transform: first }
      publisher: { expr: publisher, transform: first }

  - id: openaire-projekty-pl
    type: rest
    kind: project
    schedule_s: 86400
    description: "OpenAIRE Graph /projects z polskim partnerem (ok. 15,8 tys.; bez tokena 60 zapytań/h, z OPENAIRE_TOKEN 7200/h)"
    options:
      url: https://api.openaire.eu/graph/v1/projects
      params: { relOrganizationCountryCode: PL, pageSize: 50, cursor: "*" }
      headers: { Authorization: "Bearer ${OPENAIRE_TOKEN:-}" }
      pagination: { type: cursor, cursor_param: cursor, cursor_path: header.nextCursor }
      max_pages: 5
      timeout: 60
    record_path: results
    id_path: id
    mapping:
      title: title
      abstract: summary
      keywords: keywords
      year: { expr: startDate, transform: year }
      url: websiteUrl
      amount_total: { expr: totalCost, transform: pl_decimal }
      amount_funded: { expr: fundedAmount, transform: pl_decimal }
      code: code
      funder: { expr: "fundings[0].shortName" }

  - id: radon-projekty
    type: rest
    enabled: false   # zastąpione przez harvester-radon
    kind: project
    schedule_s: 604800
    description: "RAD-on projekty krajowe (NCN, NCBR), ok. 49 tys., stronicowanie tokenem (sprawdzone 2026-11-21)"
    options:
      url: https://radon.nauka.gov.pl/opendata/polon/projects
      params: { resultNumbers: 100 }
      pagination: { type: cursor, cursor_param: token, cursor_path: pagination.token }
      max_pages: 5
      timeout: 60
    record_path: results
    id_path: projectUuid
    mapping:
      title: projectTitlePl
      abstract: projectAbstractPl
      keywords: keywords
      affiliations: "implementingInstitutions[].institutionName"
      year: { expr: projectStartDate, transform: year }
      amount_total: { expr: totalFunds, transform: pl_decimal }

  - id: kohesio-projekty
    type: rest
    kind: project
    schedule_s: 86400
    description: "Kohesio /api/projects, Polska (ok. 121 tys. projektów spójności UE); pobierane porcjami po 100"
    options:
      url: https://kohesio.ec.europa.eu/api/projects
      params: { country: "https://linkedopendata.eu/entity/Q13", language: pl, limit: 100 }
      pagination: { type: offset, param: offset }
      max_pages: 5
      timeout: 60
      min_abstract_chars: 150
    record_path: list
    id_path: item
    mapping:
      title: { expr: labels, transform: first }
      abstract: { expr: descriptions, transform: first }
      year: { expr: startTimes, transform: year }
      url: link
      amount_eu: { expr: euBudgets, transform: pl_decimal }
      amount_total: { expr: totalBudgets, transform: pl_decimal }
      start: { expr: startTimes, transform: first }
      end: { expr: endTimes, transform: first }
      objective: { expr: objectiveIds, transform: first }
      coordinates: { expr: coordinates, transform: first }
      implementation: { const: true }

  - id: epo-patenty-prz
    type: sparql
    enabled: false   # TODO(issue Dane): CONTAINS() over all applicants times out; query by exact vcard:fn / applicant URI
    kind: patent
    schedule_s: 604800
    description: "EPO Linked Data: publikacje EP zgłaszającego (przykład: Politechnika Rzeszowska)"
    options:
      endpoint: https://data.epo.org/linked-data/query
      page_size: 100
      timeout: 120
      query: |
        PREFIX patent: <http://data.epo.org/linked-data/def/patent/>
        PREFIX vcard: <http://www.w3.org/2006/vcard/ns#>
        SELECT ?publication ?title ?date ?kind WHERE {
          ?publication patent:applicantVC ?a ; patent:titleOfInvention ?title ;
                       patent:publicationDate ?date ; patent:publicationKind ?kind .
          ?a vcard:fn ?name .
          FILTER(CONTAINS(LCASE(STR(?name)), "politechnika rzeszowska"))
        } ORDER BY ?publication LIMIT {limit} OFFSET {offset}
      min_abstract_chars: 0
    id_path: publication
    mapping:
      title: title
      abstract: title
      year: { expr: date, transform: year }
      url: publication
      patent_kind: kind

  # ------------------------------------------------------------------ HARVESTER zespołu (radar/refresh.py)
  # `python -X utf8 -m radar.refresh` (albo `docker compose --profile harvester up`) pobiera i normalizuje
  # źródła do data/normalized/<id>.jsonl w formacie radar.record/v1 (blokada, pobieranie przyrostowe,
  # kontrola spadku liczby rekordów). Tu te pliki wchodzą do kolejki: normalize -> Basal -> agent.
  # Brak pliku = źródło jeszcze nie odświeżone (optional), nie błąd. Wspólne mapowanie: &record_v1.
  - id: harvester-ncbr
    type: snapshot
    kind: solution
    schedule_s: 3600
    description: "NCBR: wyszukiwarka sukcesów beneficjentów (harvester radar/refresh.py)"
    options: { path: "${RADAR_HARVEST_DIR:-../data/normalized}/ncbr.jsonl", optional: true, min_abstract_chars: 150 }
    id_path: record_id
    mapping: &record_v1
      title: title
      abstract: { expr: "text_for_llm || text || intro || abstract || description", transform: first }
      affiliations: "organizations[].name"
      region: { expr: "region.voivodeships", transform: first }
      keywords: keywords
      url: url
      doi: { expr: "ids.doi || doi", transform: doi }
      year: { expr: "period.start || year || date", transform: year }
      language: language
      licence: rights.licence
      amount_total: { expr: "funding.total_value", transform: pl_decimal }
      amount_grant: { expr: "funding.grant_value", transform: pl_decimal }
      record_type: record_type
      harvester_source: source
      quality_status: quality.status

  - id: harvester-interreg
    type: snapshot
    kind: project
    schedule_s: 3600
    description: "Interreg 2021–2027, projekty z partnerami z Polski (harvester)"
    options: { path: "${RADAR_HARVEST_DIR:-../data/normalized}/interreg.jsonl", optional: true, min_abstract_chars: 150 }
    id_path: record_id
    mapping: *record_v1

  - id: harvester-bibliotekanauki
    type: snapshot
    kind: publication
    schedule_s: 3600
    description: "Biblioteka Nauki: artykuły z polskich czasopism, OAI-PMH oai_openaire, okno 10 dni (harvester; zamiennik Google Scholar i PAN dLibra)"
    options: { path: "${RADAR_HARVEST_DIR:-../data/normalized}/bibliotekanauki.jsonl", optional: true, min_abstract_chars: 200 }
    id_path: record_id
    mapping: *record_v1

  - id: harvester-radon
    type: snapshot
    kind: project
    schedule_s: 3600
    description: "RAD-on: projekty krajowe finansowane przez NCN i NCBR, z instytucjami z rejestru POL-on (harvester)"
    options: { path: "${RADAR_HARVEST_DIR:-../data/normalized}/radon.jsonl", optional: true, min_abstract_chars: 150 }
    id_path: record_id
    mapping: *record_v1

  - id: harvester-openalex
    type: snapshot
    kind: publication
    schedule_s: 3600
    description: "OpenAlex: publikacje z polskich instytucji (zamiennik Google Scholar; harvester)"
    options: { path: "${RADAR_HARVEST_DIR:-../data/normalized}/openalex.jsonl", optional: true }
    id_path: record_id
    mapping: *record_v1

  - id: harvester-cordis
    type: snapshot
    kind: project
    schedule_s: 3600
    description: "CORDIS: projekty Horyzont Europa / H2020 z udziałem polskich organizacji (harvester)"
    options: { path: "${RADAR_HARVEST_DIR:-../data/normalized}/cordis.jsonl", optional: true, min_abstract_chars: 150 }
    id_path: record_id
    mapping: *record_v1

  - id: harvester-fe
    type: snapshot
    kind: project
    schedule_s: 3600
    description: "Fundusze Europejskie 2021–2027: lista projektów (harvester)"
    options: { path: "${RADAR_HARVEST_DIR:-../data/normalized}/fe_projects.jsonl", optional: true, min_abstract_chars: 120 }
    id_path: record_id
    mapping: *record_v1

  - id: harvester-epo
    type: snapshot
    kind: patent
    schedule_s: 3600
    description: "EPO: zgłoszenia EP z polskimi zgłaszającymi (harvester; zastępuje wolne zapytanie SPARQL)"
    options: { path: "${RADAR_HARVEST_DIR:-../data/normalized}/epo.jsonl", optional: true, min_abstract_chars: 80 }
    id_path: record_id
    mapping: *record_v1

  - id: harvester-uprp
    type: snapshot
    kind: patent
    schedule_s: 3600
    description: "UPRP: import ręcznego eksportu e-Wyszukiwarki (bez zapytań do UPRP; harvester)"
    options: { path: "${RADAR_HARVEST_DIR:-../data/normalized}/uprp_import.jsonl", optional: true, min_abstract_chars: 60 }
    id_path: record_id
    mapping: *record_v1

  - id: harvester-web
    type: snapshot
    kind: solution
    schedule_s: 3600
    description: "Crawler stron z config/sites.json (uczelnie, CTT, klastry, samorządy; robots.txt, 1 zapytanie / 2 s na host); eksport z bazy harvestera"
    options: { path: "${RADAR_HARVEST_DIR:-../data/normalized}/web.jsonl", optional: true, min_abstract_chars: 300 }
    id_path: record_id
    mapping: *record_v1

  # ------------------------------------------------------------------ SZABLONY (wyłączone): GraphQL i pub/sub
  - id: przyklad-graphql
    type: graphql
    enabled: false
    kind: solution
    description: "Szablon: dowolne API GraphQL ze stronicowaniem kursorem"
    options:
      url: https://example.org/graphql
      headers: { Authorization: "Bearer ${EXAMPLE_GRAPHQL_TOKEN:-}" }
      query: |
        query($after: String) { solutions(first: 50, after: $after) {
          pageInfo { endCursor hasNextPage } edges { node { id name description organization { name } } } } }
      cursor_var: after
      end_cursor_path: data.solutions.pageInfo.endCursor
      has_next_path: data.solutions.pageInfo.hasNextPage
    record_path: "data.solutions.edges[].node"
    mapping: { title: name, abstract: description, affiliations: "[organization.name]" }

  - id: przyklad-amqp
    type: amqp
    enabled: false
    kind: solution
    description: "Szablon: kolejka RabbitMQ/AMQP z systemu partnera (DLQ: ingest.<id>.dlq)"
    options: { url: "${PARTNER_AMQP_URL:-}", exchange: partner.innovations, routing_key: "innovation.#" }
    mapping: { title: title, abstract: description, affiliations: "[institution]" }

  - id: przyklad-gcp-pubsub
    type: gcp_pubsub
    enabled: false
    kind: solution
    description: "Szablon: Google Cloud Pub/Sub (GOOGLE_APPLICATION_CREDENTIALS z Secret)"
    options: { subscription: "projects/${GCP_PROJECT:-x}/subscriptions/radar-innovations" }
    mapping: { title: title, abstract: description }

  - id: przyklad-kafka
    type: kafka
    enabled: false
    kind: solution
    description: "Szablon: temat Kafka"
    options: { bootstrap_servers: "${KAFKA_BOOTSTRAP:-kafka:9092}", topic: innovations }
    mapping: { title: title, abstract: description }
