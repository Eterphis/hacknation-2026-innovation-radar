[project]
name = "innovation-radar"
version = "0.1.0"
description = "Radar Innowacji: wykrywanie, ocena i kierowanie ukrytych innowacji z instytucji publicznych"
license = { text = "EUPL-1.2" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "celery>=5.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "jmespath>=1.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Push transports are optional so the base image stays small; the Dockerfile installs all of them.
gcp = ["google-cloud-pubsub>=2.21"]
kafka = ["kafka-python-ng>=2.2"]
# Better embeddings on CPU (ONNX): RADAR_EMBEDDER=fastembed
embed = ["fastembed>=0.4"]
dev = ["pytest>=8.0", "respx>=0.21"]

[project.scripts]
radar = "radar.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.setuptools.package-data]
radar = ["api/static/*", "migrations/script.py.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
